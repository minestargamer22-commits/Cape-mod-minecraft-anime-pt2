name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Unzip
        run: |
          unzip -q -o capemod-fabric-1.21.4.zip
          unzip -q -o capemod-fabric-1.21.8.zip
      - name: Build 1.21.4
        run: cd fabric-1.21.4 && gradle build --console=plain 2>&1 | tee ../b4.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - name: Build 1.21.8
        run: cd fabric-1.21.8 && gradle build --console=plain 2>&1 | tee ../b8.log; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - name: Show errors
        if: always()
        run: |
          echo '### Errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -hE "error:|What went wrong|Could not" -A4 b4.log b8.log | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: |
            fabric-1.21.4/build/libs/*.jar
            fabric-1.21.8/build/libs/*.jar
            !fabric-*/build/libs/*-sources.jar
