name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.8", "1.21.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip
        run: for z in capemod-fabric-*.zip; do unzip -oq "$z"; done

      - name: Show project files
        run: |
          ls -la fabric-${{ matrix.version }}
          cat fabric-${{ matrix.version }}/gradle.properties || true

      - name: Build ${{ matrix.version }}
        working-directory: fabric-${{ matrix.version }}
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --stacktrace 2>&1 | tee build.log
          else
            gradle build --stacktrace 2>&1 | tee build.log
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jar-${{ matrix.version }}
          path: |
            fabric-${{ matrix.version }}/build/libs/*.jar
            !fabric-${{ matrix.version }}/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.version }}
          path: fabric-${{ matrix.version }}/build.log

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: jars
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cape Mod build ${{ github.run_number }}
          files: jars/*.jar
